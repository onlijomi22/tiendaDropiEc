default: &default
  theme_color: "blue"
  tone: "practical"
  primary_objection: "Es de buena calidad?"
  trust_signals:
    - "Pago contra entrega"
    - "Envio a todo Ecuador"
  price_range_min: 10.0
  price_range_max: 60.0
  typical_margin_pct: 40.0
  min_clean_images: 2
  prefer_lifestyle_images: false
  show_comparison_table: true
  show_reviews_section: true
  show_specs_table: false
  show_faq: true

