[tool.poetry]
name = "tienda-dropi-ec"
version = "0.1.0"
description = "Sistema de agentes IA para dropshipping con Dropi Ecuador"
authors = ["TiendaDropiEc Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
google-genai = "^1.15.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
playwright = "^1.44"
google-ads = "^24.0.0"
apscheduler = "^3.10"
httpx = "^0.27"
rich = "^13.7"
loguru = "^0.7"
python-dotenv = "^1.0"
markitdown = "*"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-bdd = "^7.0"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
ruff = "^0.4"
mypy = "^1.10"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
